name: delivery_app
description: A delivery and accounting application for stores
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Barcode Scanner
  mobile_scanner: ^3.5.0
  
  # File Picker for Excel/PDF
  file_picker: ^6.1.1
  
  # Excel import/export
  excel: ^2.0.0
  
  # URL Launcher for email
  url_launcher: ^6.2.1
  
  # For Persian date formatting
  intl: ^0.18.1
  
  # For better UI
  flutter_svg: ^2.0.9
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Assets (if you have any images or fonts)
  # assets:
  #   - assets/images/
  #   - assets/fonts/
  
  # Fonts (if you need Persian fonts)
  # fonts:
  #   - family: Vazir
  #     fonts:
  #       - asset: assets/fonts/Vazir.ttf
  #       - asset: assets/fonts/Vazir-Bold.ttf
  #         weight: 700